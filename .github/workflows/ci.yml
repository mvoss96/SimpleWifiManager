name: CI

on:
  push:
  pull_request:

jobs:
  manifests:
    # library.properties (Arduino) and library.json (PlatformIO) both carry a
    # version field and drift silently if only one is bumped. This gate keeps
    # them in lockstep; release.yml additionally checks the tag against both
    # on release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Manifest versions must match
        run: |
          PROPS=$(grep '^version=' library.properties | cut -d= -f2)
          JSON=$(python3 -c "import json; print(json.load(open('library.json'))['version'])")
          echo "library.properties=$PROPS library.json=$JSON"
          test "$PROPS" = "$JSON"

  arduino-lint:
    # Checks Arduino Library Manager submission requirements on every change,
    # so the library stays acceptable to the registry between releases.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: arduino/arduino-lint-action@v2
        with:
          # update = checks for a library already in the Library Manager
          # index (accepted 2026-07-23 via arduino/library-registry#8802).
          library-manager: update
          compliance: strict
